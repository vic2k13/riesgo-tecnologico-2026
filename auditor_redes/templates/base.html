<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Auditor de Redes{% endblock %}</title>
    <!-- CDN Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <!-- Barra de navegación principal -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container-fluid">
            <a class="navbar-brand fw-bold" href="{% url 'inicio' %}">Auditor de Redes</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                    <li class="nav-item">
                        <a class="nav-link active" href="{% url 'inicio' %}">Inicio</a>
                    </li>
                    <!-- Aquí agregaremos más enlaces a las demás apps -->
                </ul>
            </div>
        </div>
    </nav>

    <!-- Contenido principal variable -->
    <main class="container my-4">
        {% block content %}
        <!-- El contenido específico de cada página se inyecta aquí -->
        {% endblock %}
    </main>

    <!-- Pie de página global -->
    <footer class="bg-white border-top text-center py-3 mt-auto">
        <div class="container text-muted small">
            &copy; Auditor de Redes - Riesgo Tecnológico
        </div>
    </footer>

    <!-- CDN Bootstrap 5 JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
